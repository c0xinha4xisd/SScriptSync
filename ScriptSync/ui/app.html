function findClipDomElement(link) {
  if (!link) return null;
  for (let lineIdx = 0; lineIdx < parsedLines.length; lineIdx++) {
    const line = parsedLines[lineIdx];
    const match = getLineLinks(line).some(lk => {
      if (lk.link_type !== 'clip') return false;
      if (link.link_id && lk.link_id === link.link_id) return true;
      return linkMatchesClip(lk, { clip_index: link.clip_index, clip_uid: link.clip_uid });
    });
    if (!match) continue;
    const node = document.querySelector(`.sync-node-v0[data-line-index="${lineIdx}"]`);
    if (node) return node;
  }
  if (link.clip_index != null) {
    const byIdx = document.querySelector(
      `.clip-item[data-clip-index="${link.clip_index}"]:not(.clip-hidden)`
    );
    if (byIdx) return byIdx;
  }
  if (link.clip_uid) {
    const byUid = document.querySelector(
      `.clip-item[data-clip-uid="${link.clip_uid}"]:not(.clip-hidden)`
    );
    if (byUid) return byUid;
  }
  const clip = timelineClips.find(c => linkMatchesClip(link, c));
  if (clip) {
    return document.querySelector(
      `.clip-item[data-clip-index="${clip.clip_index}"]:not(.clip-hidden)`
    );
  }
  return null;
}

function getClipRightAnchor(clipEl, mainRect) {
  const thumb = clipEl.querySelector?.('.spine-thumb-img:not(.empty)') || clipEl;
  const r = thumb.getBoundingClientRect();
  return {
    x: r.right + CLIP_EDGE_OUTSET - mainRect.left,
    y: r.top + r.height / 2 - mainRect.top,
  };
}

function getLineBarAnchor(lineEl, mainRect) {
  const card = lineEl.querySelector('.script-row') || lineEl.querySelector('.script-card') || lineEl;
  const r = card.getBoundingClientRect();
  return {
    x: r.left + LINE_BAR_INSET - mainRect.left,
    y: r.top + r.height / 2 - mainRect.top,
  };
}

function buildClipToLinePathD(clipPt, linePt) {
  const xLine = linePt.x;
  const yLine = linePt.y;
  const xClip = clipPt.x;
  const yClip = clipPt.y;
  const stub = LINE_BAR_INSET;
  const xStub = xLine - stub;
  if (Math.abs(yClip - yLine) < 6) {
    return `M ${xClip} ${yLine} L ${xStub} ${yLine} L ${xLine} ${yLine}`;
  }
  const dx = Math.max(28, (xStub - xClip) * 0.45);
  const cx1 = xClip + dx * 0.55;
  const cx2 = xStub - dx * 0.35;
  return `M ${xClip} ${yClip} C ${cx1} ${yClip}, ${cx2} ${yLine}, ${xStub} ${yLine} L ${xLine} ${yLine}`;
}

function updateConnectionHighlights() {
  const hiLines = getHighlightedLineSet();
  const hasFocus = focusedClipIndex >= 0 || hiLines.size > 0;
  const hiClipIndexes = new Set();
  if (focusedClipIndex >= 0) hiClipIndexes.add(focusedClipIndex);
  hiLines.forEach(lineIdx => {
    const line = parsedLines[lineIdx];
    if (!line) return;
    getLineLinks(line).forEach(link => {
      if (link.clip_index != null) hiClipIndexes.add(link.clip_index);
      const clip = timelineClips.find(c => linkMatchesClip(link, c));
      if (clip) hiClipIndexes.add(clip.clip_index);
    });
  });

  document.querySelectorAll('.script-line').forEach(el => {
    const idx = parseInt(el.dataset.index, 10);
    el.classList.toggle('conn-highlight', hasFocus && hiLines.has(idx));
  });

  if (!hasFocus) {
    document.querySelectorAll('.clip-item.conn-highlight, .sync-node-v0.conn-highlight').forEach(el => {
      el.classList.remove('conn-highlight');
    });
    return;
  }

  document.querySelectorAll('.clip-item').forEach(el => {
    const idx = parseInt(el.dataset.clipIndex, 10);
    el.classList.toggle('conn-highlight', hiClipIndexes.has(idx));
  });
  document.querySelectorAll('.sync-node-v0').forEach(el => {
    const idx = parseInt(el.dataset.lineIndex, 10);
    el.classList.toggle('conn-highlight', hiLines.has(idx) || idx === activeLineIndex);
  });
}

function isLinkHighlighted(lineIdx, link) {
  if (getHighlightedLineSet().has(lineIdx)) return true;
  if (lineIdx === activeLineIndex) return true;
  if (focusedClipIndex >= 0) {
    if (link.clip_index === focusedClipIndex) return true;
    const fc = timelineClips[focusedClipIndex];
    if (fc && linkMatchesClip(link, fc)) return true;
  }
  return false;
}

const SCENE_RE = /^(INT[\.\s/]|EXT[\.\s/]|INT\/EXT|I\/E[\.\s]|CENA\s+\d|SCENE\s+\d)/i;

function getLineLinks(line) {
  if (!line) return [];
  if (Array.isArray(line.links) && line.links.length) return line.links;
  if (line.link_id || line.start_tc || line.timecode) {
    return [{
      link_id: line.link_id,
      link_type: line.link_type || 'clip',
      link_color: line.link_color,
      link_label: line.link_label,
      clip_uid: line.clip_uid,
      clip_index: line.clip_index,
      clip_name: line.clip_name,
      clip_start_frame: line.clip_start_frame,
      clip_end_frame: line.clip_end_frame,
      track_index: line.track_index,
      track_label: line.track_label,
      start_tc: line.start_tc || line.timecode,
      end_tc: line.end_tc,
      marker_frame: line.marker_frame,
    }];
  }
  return [];
}

function lineIsLinked(line) {
  return getLineLinks(line).length > 0;
}

function setPlaybackActive(active, fromBackend = false) {
  playbackActive = active;
  document.body.classList.toggle('playback-active', active);
  if (!fromBackend && backend && backend.set_playback_mode) {
    try { backend.set_playback_mode(active); } catch (_) {}
  }
}

function noteTimecodeTick() {
  const now = Date.now();
  if (now - lastTcTickMs < 450) tcBurstCount += 1;
  else tcBurstCount = 0;
  lastTcTickMs = now;
  if (tcBurstCount >= 3) setPlaybackActive(true);
  clearTimeout(playbackIdleTimer);
  playbackIdleTimer = setTimeout(() => {
    tcBurstCount = 0;
    setPlaybackActive(false);
    scheduleLayoutUpdate();
  }, 900);
}

function findSyncNode(lineIdx) {
  return document.querySelector(`.sync-node-v0[data-line-index="${lineIdx}"]`);
}

function truncateLabel(text, max = 14) {
  const t = (text || '').trim();
  if (t.length <= max) return t;
  return `${t.slice(0, max - 1)}…`;
}

function syncRailKey() {
  const clipPart = timelineClips.map(c => `${c.clip_uid || c.clip_index}:${c.start_frame}`).join('|');
  const linkPart = parsedLines
    .flatMap(l => getLineLinks(l))
    .map(lk => `${lk.link_id || ''}:${lk.link_label || ''}:${lk.clip_uid || lk.clip_index}:${lk.start_tc || ''}`)
    .join('|');
  return `${parsedLines.length}::${clipPart}::${linkPart}`;
}

function renderLineGutter() {
  /* v0: coverage via minimap — gutter hidden */
}

function syncGutterRowHeights() {
  document.querySelectorAll('.gutter-row').forEach(gr => {
    const idx = parseInt(gr.dataset.index, 10);
    const lineEl = document.querySelector(`.script-line[data-index="${idx}"]:not(.find-hidden)`);
    if (lineEl) {
      gr.style.minHeight = `${lineEl.offsetHeight}px`;
      gr.style.height = `${lineEl.offsetHeight}px`;
    }
  });
}

function scheduleLayoutUpdate() {
  if (window.__uiBusy) return;
  if (layoutTimer) return;
  layoutTimer = setTimeout(() => {
    layoutTimer = null;
    updateRailMetrics();
    updatePlayheadRuler();
    if (hasActiveLinkVisual()) drawLinkConnections();
  }, 96);
}

function scheduleScrollSync() {
  if (window.__uiBusy) return;
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => {
    scrollRaf = null;
    if (!playbackActive) {
      updateRailMetrics();
      updatePlayheadRuler();
    }
    if (hasActiveLinkVisual()) drawLinkConnections();
  });
}

function drawLinkConnections() {
  computeWorkspacePaths();
  updateConnectionHighlights();
}

function applyFindFilter() {
  const q = (document.getElementById('find-input')?.value || '').trim().toLowerCase();
  const visible = document.getElementById('find-input-visible');
  if (visible && visible.value !== q) visible.value = q;
  document.querySelectorAll('.script-block').forEach(el => {
    const idx = parseInt(el.dataset.index, 10);
    const text = (parsedLines[idx]?.text || '').toLowerCase();
    el.classList.toggle('find-hidden', Boolean(q) && !text.includes(q));
  });
  scheduleLayoutUpdate();
}

function setProjectLabel(name) {
  const el = document.getElementById('project-label');
  if (el) el.textContent = name || 'Untitled';
}

function updatePlayheadRuler() {
  if (lastPlayheadIndex >= 0 && lastPlayheadIndex !== activeLineIndex) {
    document.querySelector(`.script-line[data-index="${lastPlayheadIndex}"]`)?.classList.remove('playhead-row');
  }
  if (activeLineIndex >= 0) {
    document.querySelector(`.script-line[data-index="${activeLineIndex}"]`)?.classList.add('playhead-row');
  }
  lastPlayheadIndex = activeLineIndex;
}

function buildScenePageIndex() {
  sceneIndex = [];
  pageIndex = [];
  parsedLines.forEach((line, i) => {
    const text = (line.text || '').trim();
    if (!text) return;
    if (SCENE_RE.test(text) || (text === text.toUpperCase() && text.length < 60 && /[-–]/.test(text))) {
      sceneIndex.push({ index: i, number: sceneIndex.length + 1, title: text.slice(0, 72) });
    }
  });
  const perPage = 54;
  for (let start = 0; start < parsedLines.length; start += perPage) {
    pageIndex.push({ index: start, number: pageIndex.length + 1, title: `Page ${pageIndex.length + 1}` });
  }
  updateScenePageSelects();
}

function updateScenePageSelects() {
  const sceneSel = document.getElementById('scene-select');
  const pageSel = document.getElementById('page-select');
  if (sceneSel) {
    const cur = sceneSel.value;
    sceneSel.innerHTML = '<option value="">Scene</option>' +
      sceneIndex.map(s => `<option value="${s.index}">${s.number}. ${escapeHtml(s.title.slice(0, 28))}</option>`).join('');
    if (cur) sceneSel.value = cur;
  }
  if (pageSel) {
    const cur = pageSel.value;
    pageSel.innerHTML = '<option value="">Page</option>' +
      pageIndex.map(p => `<option value="${p.index}">${p.title}</option>`).join('');
    if (cur) pageSel.value = cur;
  }
}

function scrollToLine(index, skipHighlight = false) {
  if (index < 0) return;
  const block = document.querySelector(`.script-block[data-index="${index}"]:not(.find-hidden)`);
  const body = document.getElementById('workspace-body');
  if (block && body) {
    const bodyRect = body.getBoundingClientRect();
    const lr = block.getBoundingClientRect();
    const target = body.scrollTop + (lr.top - bodyRect.top) - body.clientHeight / 2 + lr.height / 2;
    body.scrollTop = Math.max(0, target);
    updateMinimapViewport();
    positionSpineNodes();
  }
  if (!skipHighlight) highlightActiveLine(index, false);
}

function goToScene(val) {
  if (val === '') return;
  scrollToLine(parseInt(val, 10));
}

function goToPage(val) {
  if (val === '') return;
  scrollToLine(parseInt(val, 10));
}

function prevScene() {
  if (!sceneIndex.length) return;
  let target = 0;
  for (let i = sceneIndex.length - 1; i >= 0; i--) {
    if (sceneIndex[i].index < activeLineIndex) { target = i; break; }
  }
  currentSceneIdx = target;
  scrollToLine(sceneIndex[target].index);
  document.getElementById('scene-select').value = String(sceneIndex[target].index);
}

function nextScene() {
  if (!sceneIndex.length) return;
  let target = sceneIndex.length - 1;
  for (let i = 0; i < sceneIndex.length; i++) {
    if (sceneIndex[i].index > activeLineIndex) { target = i; break; }
  }
  currentSceneIdx = target;
  scrollToLine(sceneIndex[target].index);
  document.getElementById('scene-select').value = String(sceneIndex[target].index);
}

function resyncTimeline() {
  if (!backend) return;
  lastRailKey = '';
  backend.resync_timeline();
}

function linkMatchesClip(link, clip) {
  if (link.link_type !== 'clip') return false;
  const uid = clip.clip_uid;
  if (uid && link.clip_uid) return link.clip_uid === uid;
  const sameFrame = link.clip_start_frame != null && clip.start_frame != null
    && Number(link.clip_start_frame) === Number(clip.start_frame);
  const sameTrack = Number(link.track_index || 1) === Number(clip.track_index || 1);
  if (sameFrame && sameTrack) return true;
  return link.clip_index === clip.clip_index;
}

function linksForClip(clip) {
  const entries = [];
  parsedLines.forEach((line, lineIdx) => {
    getLineLinks(line).forEach((link, linkIdx) => {
      if (!linkMatchesClip(link, clip)) return;
      entries.push({
        lineIdx,
        link,
        linkKey: `${lineIdx}:${link.link_id || linkIdx}:${link.start_tc || ''}`,
      });
    });
  });
  return entries;
}

function linesForClip(clip) {
  const seen = new Set();
  return linksForClip(clip)
    .map(e => e.lineIdx)
    .filter(i => {
      if (seen.has(i)) return false;
      seen.add(i);
      return true;
    });
}

function linkColorForLine(line, link) {
  return (link && link.link_color) || line.link_color || '#facc15';
}

function thumbKeyForClip(clip) {
  if (!clip) return '';
  const isAudio = clip.is_audio || clip.track_type === 'audio';
  return clip.clip_uid || `${isAudio ? 'a' : 'v'}${clip.track_index || 1}_${clip.start_frame ?? ''}`;
}

function setClipFilter(type) {
  clipFilterType = type || 'all';
  document.querySelectorAll('.clip-type-btn').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.clipFilter === clipFilterType);
  });
  applyClipFindFilter();
}

function applyClipFindFilter() {
  const q = (document.getElementById('clip-find-input')?.value || '').trim().toLowerCase();
  document.querySelectorAll('.clip-item').forEach(el => {
    const scene = el.querySelector('.media-scene')?.textContent?.toLowerCase() || '';
    const tc = (el.dataset.tc || '').toLowerCase();
    const track = (el.dataset.trackLabel || el.dataset.trackType || '').toLowerCase();
    const type = el.dataset.trackType || 'video';
    const typeOk = clipFilterType === 'all'
      || (clipFilterType === 'video' && type === 'video')
      || (clipFilterType === 'audio' && type === 'audio');
    const textOk = !q || scene.includes(q) || tc.includes(q) || track.includes(q);
    el.classList.toggle('clip-hidden', !typeOk || !textOk);
  });
  bindClipDragSources();
  if (hasActiveLinkVisual()) scheduleScrollSync();
}

function focusClipInResolve(clip) {
  if (!clip || !backend) return;
  focusedClipIndex = clip.clip_index;
  drawLinkConnections();
  document.querySelectorAll('.clip-item').forEach(el => {
    el.classList.toggle('focused', parseInt(el.dataset.clipIndex, 10) === focusedClipIndex);
  });
  updateConnectionHighlights();
  backend.focus_clip(JSON.stringify(clip));
}

function thumbHtml(clip, color, label) {
  const key = thumbKeyForClip(clip);
  const uri = clipThumbnails[key];
  const initials = (label || 'CLP').replace(/[^A-Za-z0-9]/g, '').slice(0, 3) || 'CLP';
  if (uri) {
    return `<img src="${uri}" alt="${escapeHtml(label)}" style="border-color:${color}">`;
  }
  return `<span>${escapeHtml(initials)}</span>`;
}

function applyClipThumbnails() {
  document.querySelectorAll('[data-thumb-key]').forEach(el => {
    const key = el.dataset.thumbKey;
    const uri = clipThumbnails[key];
    if (!uri) return;
    if (el.tagName === 'IMG') {
      el.src = uri;
      el.style.display = 'block';
    } else {
      el.style.backgroundImage = `url("${uri}")`;
      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
    }
  });
}

function setLinkHint(msg) {
  if (msg) setStatus(msg, '#facc15');
}

function toggleLinkMode() {
  linkMode = !linkMode;
  const btn = document.getElementById('link-mode-btn');
  btn.classList.toggle('active', linkMode);
  document.body.classList.toggle('link-mode', linkMode);
  if (linkMode) {
    setLinkHint('Select lines → click clip to link (AVID style)');
    setStatus('Link Mode: select text, then click a clip', '#facc15');
  } else {
    selectedLines.clear();
    setLinkHint('');
    updateLineSelectionUi();
    drawLinkConnections();
    scheduleLayoutUpdate();
  }
}

function focusLineConnections(index) {
  if (index < 0 || !parsedLines[index]) {
    focusedClipIndex = -1;
    return;
  }
  const clipLink = getLineLinks(parsedLines[index]).find(
    l => l.link_type === 'clip' && (l.clip_index != null || l.clip_uid)
  );
  if (!clipLink) {
    focusedClipIndex = -1;
    return;
  }
  const clip = timelineClips.find(c => linkMatchesClip(clipLink, c));
  focusedClipIndex = clip ? clip.clip_index : (clipLink.clip_index ?? -1);
}

function updateLineSelectionUi() {
  document.querySelectorAll('.script-line').forEach(el => {
    const idx = parseInt(el.dataset.index, 10);
    el.classList.toggle('selected', selectedLines.has(idx));
  });
  updateConnectionHighlights();
  computeWorkspacePaths();
}

function toggleLineSelection(index, event) {
  if (event?.shiftKey && lastSelectedIndex >= 0) {
    const a = Math.min(lastSelectedIndex, index);
    const b = Math.max(lastSelectedIndex, index);
    for (let i = a; i <= b; i++) selectedLines.add(i);
  } else if (event?.ctrlKey || event?.metaKey) {
    if (selectedLines.has(index)) selectedLines.delete(index);
    else selectedLines.add(index);
    lastSelectedIndex = index;
  } else {
    selectedLines.clear();
    selectedLines.add(index);
    lastSelectedIndex = index;
  }
  activeLineIndex = index;
  focusLineConnections(index);
  updateLineSelectionUi();
  const n = selectedLines.size;
  setLinkHint(`${n} linha(s) selecionada(s)`);
  setStatus(`Link Mode: ${n} linha(s) — clique ou arraste um clip`, '#facc15');
  renderTakeCards();
}

function linkToPlayhead() {
  if (!backend) return;
  const indices = getSelectedLineIndices();
  if (!indices.length) {
    setStatus('Selecione linha(s) no roteiro', '#f6c177');
    return;
  }
  activeLineIndex = indices[0];
  backend.link_lines_to_playhead(JSON.stringify(indices));
  selectedLines.clear();
  focusedClipIndex = -1;
}

function unlinkSelected() {
  if (!backend) return;
  const indices = getSelectedLineIndices();
  if (!indices.length) {
    setStatus('Selecione linha(s) para desvincular', '#f6c177');
    return;
  }
  backend.unlink_lines(JSON.stringify(indices));
  selectedLines.clear();
  scheduleLayoutUpdate();
}

function linkSelectionToClip(clip) {
  linkClipToScript(clip);
}

function resolveLinkTargetLines() {
  if (selectedLines.size) return [...selectedLines].sort((a, b) => a - b);
  if (activeLineIndex >= 0) return [activeLineIndex];
  return [];
}

function lineIndexAtClientY(clientY) {
  const rows = document.querySelectorAll('.script-line:not(.find-hidden)');
  for (const el of rows) {
    const r = el.getBoundingClientRect();
    if (clientY >= r.top && clientY <= r.bottom) {
      return parseInt(el.dataset.index, 10);
    }
  }
  return -1;
}

function resolveClipForLink(clip) {
  if (!clip) return null;
  const full = timelineClips.find(c =>
    (clip.clip_index != null && c.clip_index === clip.clip_index)
    || (clip.clip_uid && c.clip_uid === clip.clip_uid)
  ) || clip;
  if (full.start_frame == null || full.end_frame == null) {
    setStatus('Clipe sem frames — clique Re-sync na toolbar', '#eb6f92');
    return null;
  }
  return full;
}

function lineIndexFromDropEvent(e) {
  const spineNode = e.target.closest('.spine-node');
  if (spineNode) {
    const idx = parseInt(spineNode.dataset.lineIndex, 10);
    if (!Number.isNaN(idx)) return idx;
  }
  const row = e.target.closest('.script-line');
  if (row) return parseInt(row.dataset.index, 10);
  return lineIndexAtClientY(e.clientY);
}

function linkClipToScript(clip, optionalLines) {
  const fullClip = resolveClipForLink(clip);
  if (!fullClip || !backend) return false;
  let lines = optionalLines?.length ? [...optionalLines].sort((a, b) => a - b) : resolveLinkTargetLines();
  if (!lines.length) {
    setStatus('Selecione linha(s) no roteiro ou solte no nó da spine', '#f6c177');
    return false;
  }
  backend.link_lines_to_clip(JSON.stringify(lines), JSON.stringify(fullClip));
  focusedClipIndex = fullClip.clip_index;
  activeLineIndex = lines[0];
  selectedLines.clear();
  updateLineSelectionUi();
  setStatus(`Ligando ${lines.length} linha(s) ao clip…`, '#9ccfd8');
  setFooterStatus(`Ligando linha ${lines[0] + 1}…`);
  return true;
}

const CLIP_DRAG_MIME = 'application/x-ssync-clip';

function clipFromDragEvent(e) {
  try {
    let raw = e.dataTransfer.getData(CLIP_DRAG_MIME);
    if (!raw) raw = e.dataTransfer.getData('text/plain');
    if (!raw) return null;
    const data = raw.startsWith('{') ? JSON.parse(raw) : { clip_index: parseInt(raw, 10) };
    return timelineClips.find(c => c.clip_index === data.clip_index) || null;
  } catch (_) {
    return null;
  }
}

function bindClipDragSources() {
  /* drag handlers attached once via initClipListInteractions */
}

function onClipDragStart(e) {
  const el = e.target.closest('.clip-item:not(.clip-hidden)');
  if (!el) return;
  const idx = parseInt(el.dataset.clipIndex, 10);
  const clip = timelineClips.find(c => c.clip_index === idx);
  if (!clip) return;
  e.dataTransfer.setData(CLIP_DRAG_MIME, JSON.stringify({ clip_index: clip.clip_index }));
  e.dataTransfer.setData('text/plain', String(clip.clip_index));
  e.dataTransfer.effectAllowed = 'copy';
  el.classList.add('clip-dragging');
  showPoolDropHint(true);
}

function onClipDragEnd(e) {
  const el = e.target.closest('.clip-item');
  if (el) el.classList.remove('clip-dragging');
  showPoolDropHint(false);
  clearPoolDropTargets();
}

function onClipListClick(e) {
  const el = e.target.closest('.clip-item:not(.clip-hidden)');
  if (!el) return;
  const idx = parseInt(el.dataset.clipIndex, 10);
  const clip = timelineClips.find(c => c.clip_index === idx);
  if (!clip) return;
  if (linkMode || selectedLines.size) {
    if (linkClipToScript(clip)) return;
  }
  focusClipInResolve(clip);
}

function initClipListInteractions() {
  const list = document.getElementById('clips-list');
  if (!list || list.dataset.uiBound === '1') return;
  list.dataset.uiBound = '1';
  list.addEventListener('click', onClipListClick);
  list.addEventListener('dragstart', onClipDragStart);
  list.addEventListener('dragend', onClipDragEnd);
}

function showPoolDropHint(show) {
  const hint = document.getElementById('v0-drop-zone');
  const panel = document.getElementById('timeline-panel');
  if (hint) hint.classList.toggle('visible', show);
  if (panel) panel.classList.toggle('drag-over', show);
}

function clearPoolDropTargets() {
  document.querySelectorAll('.sync-node-v0.drop-target').forEach(el => el.classList.remove('drop-target'));
  document.getElementById('timeline-panel')?.classList.remove('drag-over');
  document.getElementById('workspace-body')?.classList.remove('drag-over');
}

function dragHasClipData(e) {
  const types = e.dataTransfer?.types;
  if (!types) return false;
  const list = Array.from(types);
  return list.includes(CLIP_DRAG_MIME) || list.includes('text/plain');
}

function handleMediaPoolDragOver(e) {
  if (!dragHasClipData(e)) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
  document.getElementById('timeline-panel')?.classList.add('drag-over');
  const node = e.target.closest('.sync-node-v0');
  document.querySelectorAll('.sync-node-v0.drop-target').forEach(el => el.classList.remove('drop-target'));
  if (node) node.classList.add('drop-target');
}

function handleSpineDrop(e, lineIdx) {
  if (!dragHasClipData(e)) return;
  e.preventDefault();
  e.stopPropagation();
  showPoolDropHint(false);
  clearPoolDropTargets();
  const dragged = clipFromDragEvent(e);
  if (!dragged || Number.isNaN(lineIdx) || lineIdx < 0) return;
  if (!linkClipToScript(dragged, [lineIdx]) && !linkMode) {
    toggleLinkMode();
    setStatus('Link Mode ON — solte de novo no marcador da linha', '#f6c177');
  }
}

function handleMediaPoolDrop(e) {
  if (!dragHasClipData(e)) return;
  e.preventDefault();
  e.stopPropagation();
  showPoolDropHint(false);
  clearPoolDropTargets();
  const dragged = clipFromDragEvent(e);
  if (!dragged) {
    setStatus('Drop falhou — tente de novo ou use Link Mode + clique', '#eb6f92');
    return;
  }
  const spineNode = e.target.closest('.sync-node-v0');
  if (spineNode) {
    handleSpineDrop(e, parseInt(spineNode.dataset.lineIndex, 10));
    return;
  }
  const lineIdx = lineIndexFromDropEvent(e);
  if (lineIdx >= 0) {
    linkClipToScript(dragged, [lineIdx]);
    return;
  }
  if (!linkClipToScript(dragged) && !linkMode) {
    toggleLinkMode();
    setStatus('Link Mode ON — solte no marcador da linha desejada', '#f6c177');
  }
}

function initMediaPoolDragDrop() {
  const targets = [
    document.getElementById('timeline-panel'),
    document.getElementById('clips-list'),
    document.getElementById('workspace-body'),
  ].filter(Boolean);
  targets.forEach(el => {
    if (el.dataset.dndBound === '1') return;
    el.dataset.dndBound = '1';
    el.addEventListener('dragover', handleMediaPoolDragOver);
    el.addEventListener('dragleave', e => {
      if (!el.contains(e.relatedTarget)) {
        el.classList.remove('drag-over');
        clearPoolDropTargets();
      }
    });
    el.addEventListener('drop', handleMediaPoolDrop);
  });
}

function setStatus(message, color) {
  const statusText = document.getElementById('status-text');
  const footer = document.getElementById('footer-status');
  if (statusText) {
    statusText.textContent = message;
    if (color) statusText.style.color = color;
  }
  if (footer && message && !playbackActive) footer.textContent = message;
}

function setSyncBadge(synced) {
  isSynced = synced;
  const badge = document.getElementById('sync-badge');
  badge.textContent = synced ? 'SYNCED' : 'NOT SYNCED';
  badge.classList.toggle('on', synced);
  badge.classList.toggle('synced', synced);
}

function escapeHtml(text) {
  return String(text)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function renderClips(clips) {
  timelineClips = clips || [];
  const list = document.getElementById('clips-list');
  const sub = document.getElementById('clips-sub');
  const vCount = timelineClips.filter(c => !c.is_audio && c.track_type !== 'audio').length;
  const aCount = timelineClips.filter(c => c.is_audio || c.track_type === 'audio').length;
  if (sub) sub.textContent = `${vCount} vídeo · ${aCount} áudio`;
  if (!timelineClips.length) {
    list.innerHTML = '<div class="empty-state">Nenhum clipe na timeline (V/A)</div>';
    renderSyncRail(true);
    return;
  }
  const linkedClipIndexes = new Set();
  parsedLines.forEach(l => {
    getLineLinks(l).forEach(link => {
      if (link.link_type === 'clip' && link.clip_index != null) {
        linkedClipIndexes.add(link.clip_index);
      }
    });
  });
  list.innerHTML = timelineClips.map((c, ci) => {
    const linked = linkedClipIndexes.has(c.clip_index);
    const isAudio = c.is_audio || c.track_type === 'audio';
    const isVideo = !isAudio;
    const tkey = thumbKeyForClip(c);
    const thumbUri = clipThumbnails[tkey];
    const thumbBlock = isAudio
      ? `<span class="clip-thumb" data-thumb-key="${tkey}" aria-hidden="true">♪</span>`
      : `<img class="clip-thumb" data-thumb-key="${tkey}"${thumbUri ? ` src="${thumbUri}"` : ''} alt="">`;
    const focused = c.clip_index === focusedClipIndex ? ' focused' : '';
    const scene = sceneLabelForClip(c, ci);
    return `<div class="media-item clip-item${linked ? ' linked' : ''}${isAudio ? ' audio' : ''}${focused}" data-clip-index="${c.clip_index}" data-clip-uid="${c.clip_uid || ''}" data-tc="${c.start_tc || ''}" data-start-frame="${c.start_frame ?? ''}" data-track-type="${c.track_type || (isAudio ? 'audio' : 'video')}" data-track-label="${escapeHtml(c.track_label || (isAudio ? 'A1' : 'V1'))}">
      <div class="media-item-top">
        <span class="media-scene">${escapeHtml(scene)}</span>
        <span class="media-icons">
          ${isVideo ? '<span class="media-icon video" title="Vídeo">▶</span>' : ''}
          ${isAudio ? '<span class="media-icon audio" title="Áudio">♪</span>' : ''}
        </span>
      </div>
      <div class="clip-thumb-wrap">
        ${thumbBlock}
        <span class="clip-track-badge${isAudio ? ' audio-badge' : ''}">${escapeHtml(c.track_label || (isAudio ? 'A1' : 'V1'))}</span>
      </div>
      <div class="media-tc">
        <span class="tc-in">${escapeHtml(c.start_tc || '--:--:--:--')}</span>
        <span class="tc-out">${escapeHtml(c.end_tc || '--:--:--:--')}</span>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.clip-item').forEach(el => {
    el.setAttribute('draggable', 'true');
  });
  applyClipFindFilter();
  applyClipThumbnails();
  requestMissingThumbnails();
  bindClipDragSources();
}

function requestMissingThumbnails() {
  if (!backend || !timelineClips.length) return;
  const linkedIdx = new Set();
  parsedLines.forEach(line => {
    getLineLinks(line).forEach(lk => {
      if (lk.clip_index != null) linkedIdx.add(lk.clip_index);
    });
  });
  const linked = timelineClips.filter(c => linkedIdx.has(c.clip_index));
  const rest = timelineClips.filter(c => !linkedIdx.has(c.clip_index));
  [...linked, ...rest].slice(0, 24).forEach(c => {
    if (c.is_audio || c.track_type === 'audio') return;
    const key = thumbKeyForClip(c);
    if (!clipThumbnails[key]) {
      backend.request_clip_thumbnail(JSON.stringify(c));
    }
  });
}

let openLineMenuIndex = -1;

function closeAllLineMenus() {
  document.querySelectorAll('.line-menu-wrap.open').forEach(w => w.classList.remove('open'));
  openLineMenuIndex = -1;
}

function toggleLineMenu(index, event) {
  event?.stopPropagation();
  event?.preventDefault();
  const wrap = document.querySelector(`.line-menu-wrap[data-index="${index}"]`);
  if (!wrap) return;
  if (openLineMenuIndex === index) {
    closeAllLineMenus();
    return;
  }
  closeAllLineMenus();
  closeAllMenus();
  wrap.classList.add('open');
  openLineMenuIndex = index;
}

function buildSpineTcHtml(line) {
  const links = getLineLinks(line);
  const clipLinks = links.filter(l => l.link_type === 'clip' && l.start_tc);
  if (clipLinks.length > 1) {
    return clipLinks.map(lk =>
      `<span class="spine-tc has-tc" data-tc="${escapeHtml(lk.start_tc || '')}"` +
      `${lk.link_color ? ` style="color:${lk.link_color}"` : ''}>` +
      `${escapeHtml(lk.start_tc || '')}</span>`
    ).join('');
  }
  const primary = clipLinks[0] || links[0] || line;
  const tc = primary?.start_tc || line.start_tc || '--:--:--:--';
  const hasTc = Boolean(primary?.start_tc || line.start_tc);
  const color = primary?.link_color || line.link_color || '';
  const dataTc = hasTc ? ` data-tc="${escapeHtml(tc)}"` : '';
  const style = color ? ` style="color:${color}"` : '';
  return `<span class="spine-tc${hasTc ? ' has-tc' : ''}"${dataTc}${style}>${escapeHtml(tc)}</span>`;
}

function bindSpineTcClicks(node) {
  node.querySelectorAll('.spine-tc.has-tc').forEach(el => {
    el.addEventListener('dblclick', e => {
      e.stopPropagation();
      if (el.dataset.tc && backend) backend.jump_to_timecode(el.dataset.tc);
    });
  });
}

function startSyncNodeRename(lineIdx) {
  if (editingSyncNodeIndex >= 0) return;
  const line = parsedLines[lineIdx];
  if (!line || !getLineLinks(line).length) return;
  const clipLink = getLineLinks(line).find(l => l.link_type === 'clip') || getLineLinks(line)[0];
  const clip = clipLink ? timelineClips.find(c => linkMatchesClip(clipLink, c)) : null;
  const current = syncNodeFullTitle(line, clip, clipLink);

  editingSyncNodeIndex = lineIdx;
  const node = findSyncNode(lineIdx);
  if (!node) {
    editingSyncNodeIndex = -1;
    return;
  }
  node.classList.add('editing');
  node.innerHTML = `<input type="text" class="node-rename-input" value="${escapeHtml(current)}" maxlength="48" aria-label="Renomear sync">`;
  const inp = node.querySelector('.node-rename-input');
  if (!inp) return;
  inp.focus();
  inp.select();
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveSyncNodeRename(lineIdx, inp.value);
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      editingSyncNodeIndex = -1;
      renderTimelineSpine(true);
    }
  });
  inp.addEventListener('blur', () => {
    if (editingSyncNodeIndex === lineIdx) saveSyncNodeRename(lineIdx, inp.value);
  });
  inp.addEventListener('click', e => e.stopPropagation());
  inp.addEventListener('mousedown', e => e.stopPropagation());
}

function saveSyncNodeRename(lineIdx, label) {
  if (editingSyncNodeIndex !== lineIdx) return;
  editingSyncNodeIndex = -1;
  if (!backend) {
    renderTimelineSpine(true);
    return;
  }
  backend.set_sync_node_label(lineIdx, (label || '').trim());
}

function renderTimelineSpine(force = false) {
  if (editingSyncNodeIndex >= 0 && !force) {
    updateRailMetrics();
    return;
  }
  const key = syncRailKey();
  if (!force && key === lastRailKey) {
    updateRailMetrics();
    return;
  }
  lastRailKey = key;
  const container = document.getElementById('sync-nodes');
  if (!container) return;

  if (!parsedLines.length) {
    container.innerHTML = '';
    updateRailMetrics();
    return;
  }

  container.innerHTML = '';
  parsedLines.forEach((line, idx) => {
    const links = getLineLinks(line);
    const clipLink = links.find(l => l.link_type === 'clip' && l.clip_index != null) || links[0];
    const clip = clipLink ? timelineClips.find(c => linkMatchesClip(clipLink, c)) : null;
    const linked = links.length > 0;
    const colorCls = clip ? colorClassForClip(clip) : 'gray';
    const label = syncNodeLabel(line, clip, clipLink);
    const title = syncNodeFullTitle(line, clip, clipLink);

    const node = document.createElement('div');
    node.className = `sync-node-v0 color-${colorCls}${linked ? ' linked' : ''}${idx === activeLineIndex ? ' active' : ''}`;
    node.dataset.lineIndex = String(idx);
    node.dataset.anchor = linked ? `node-${idx}` : '';
    node.innerHTML = linked
      ? `<div class="node-ring" title="${escapeHtml(title)} — duplo-clique para renomear">
          <span class="node-label">${escapeHtml(label)}</span>
        </div>`
      : `<div class="node-ring" title="Linha ${idx + 1}"><span class="node-label">${escapeHtml(label)}</span></div>`;

    node.addEventListener('dragover', handleMediaPoolDragOver);
    node.addEventListener('drop', e => handleSpineDrop(e, idx));
    node.addEventListener('click', e => {
      if (e.target.closest('.node-rename-input')) return;
      e.stopPropagation();
      if (linkMode) {
        toggleLineSelection(idx, e);
        return;
      }
      highlightActiveLine(idx, true);
      const inp = document.querySelector(`.line-input[data-index="${idx}"]`);
      if (inp) inp.focus();
      if (clip) focusClipInResolve(clip);
      computeWorkspacePaths();
    });

    node.addEventListener('dblclick', e => {
      e.stopPropagation();
      e.preventDefault();
      if (linked) startSyncNodeRename(idx);
    });

    container.appendChild(node);
  });

  updateRailMetrics();
  initMediaPoolDragDrop();
}

function renderSyncRail(force = false) {
  renderTimelineSpine(force);
}

function updateRailMetrics() {
  const body = document.getElementById('workspace-body');
  const lane = document.getElementById('sync-lane');
  const nodes = document.getElementById('sync-nodes');
  const linesEl = document.getElementById('lines-container');
  if (!body || !nodes) return;

  const contentH = Math.max(linesEl?.scrollHeight || 0, body.clientHeight, 400);
  if (lane) lane.style.minHeight = `${contentH}px`;
  nodes.style.minHeight = `${contentH}px`;

  positionSpineNodes();
  syncGutterRowHeights();
  renderTakeCards();
  renderMinimap();
  computeWorkspacePaths();
}

function positionSpineNodes() {
  const scrollEl = document.getElementById('workspace-body');
  if (!scrollEl) return;
  const inner = scrollEl.querySelector('.v0-body-inner');
  const innerRect = inner?.getBoundingClientRect();
  if (!innerRect) return;

  scrollEl.querySelectorAll('.sync-node-v0').forEach(node => {
    const idx = parseInt(node.dataset.lineIndex, 10);
    const block = document.querySelector(`.script-block[data-index="${idx}"]:not(.find-hidden)`);
    const lineEl = block?.querySelector('.script-line') || document.querySelector(`.script-line[data-index="${idx}"]:not(.find-hidden)`);
    if (!lineEl) return;
    const anchor = block || lineEl;
    const ar = anchor.getBoundingClientRect();
    const top = ar.top + ar.height / 2 - innerRect.top + scrollEl.scrollTop;
    node.style.top = `${Math.max(24, top)}px`;
  });
}

function positionSyncNodes() {
  positionSpineNodes();
}

function getEditorFocusState() {
  const el = document.activeElement;
  if (!el || !el.classList.contains('line-input')) return null;
  return {
    index: parseInt(el.dataset.index, 10),
    start: el.selectionStart,
    end: el.selectionEnd,
  };
}

function autoResizeInput(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = `${Math.max(22, el.scrollHeight)}px`;
}

function scheduleSyncToBackend() {
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(() => {
    if (!backend) return;
    backend.sync_lines_from_ui(JSON.stringify(parsedLines));
  }, 450);
}

function insertLineLocal(afterIndex, text = '', focus = true) {
  const at = Math.max(-1, Math.min(afterIndex, parsedLines.length - 1));
  const newLine = { text, line_number: at + 2 };
  parsedLines.splice(at + 1, 0, newLine);
  for (let i = 0; i < parsedLines.length; i++) parsedLines[i].line_number = i + 1;
  pendingFocusIndex = focus ? at + 1 : -1;
  renderLines(parsedLines);
  scheduleSyncToBackend();
}

function deleteLineLocal(index) {
  deleteLinesAt([index], false);
}

function deleteLinesAt(indices, ask = true) {
  const uniq = [...new Set(indices)].filter(i => i >= 0 && i < parsedLines.length);
  if (!uniq.length) return;
  if (parsedLines.length - uniq.length < 1) {
    setStatus('Precisa de ao menos 1 linha', '#eb6f92');
    return;
  }
  if (ask && !confirm(`Excluir ${uniq.length} linha(s)?`)) return;
  const sorted = uniq.sort((a, b) => b - a);
  sorted.forEach(i => parsedLines.splice(i, 1));
  for (let i = 0; i < parsedLines.length; i++) parsedLines[i].line_number = i + 1;
  selectedLines.clear();
  openNoteIndex = -1;
  pendingFocusIndex = Math.max(0, (sorted[sorted.length - 1] || 1) - 1);
  renderLines(parsedLines);
  if (backend) backend.sync_lines_from_ui(JSON.stringify(parsedLines));
  else scheduleSyncToBackend();
  setStatus(`Excluída(s) ${uniq.length} linha(s)`, '#9ccfd8');
  scheduleLayoutUpdate();
}

function bindLineInput(el) {
  const idx = parseInt(el.dataset.index, 10);
  autoResizeInput(el);

  el.addEventListener('focus', () => {
    isEditorFocused = true;
    highlightActiveLine(idx, false);
  });

  el.addEventListener('blur', () => {
    isEditorFocused = false;
  });

  el.addEventListener('input', () => {
    if (Number.isNaN(idx) || !parsedLines[idx]) return;
    parsedLines[idx].text = el.value;
    autoResizeInput(el);
    applyGcValidation(el);
    const row = el.closest('.script-line');
    if (row) {
      const prevLine = parsedLines[idx - 1];
      const prevType = prevLine ? classifyScriptLine(prevLine.text) : '';
      const lt = classifyScriptLine(el.value, prevType);
      row.className = row.className.replace(/\btype-\w+/g, '').trim();
      row.classList.add(`type-${lt}`);
    }
    scheduleSyncToBackend();
  });

  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const pos = el.selectionStart;
      const before = el.value.slice(0, pos);
      const after = el.value.slice(pos);
      parsedLines[idx].text = before;
      insertLineLocal(idx, after);
      return;
    }
    if (e.key === 'Backspace' && el.value === '' && idx > 0) {
      e.preventDefault();
      deleteLineLocal(idx);
      return;
    }
    if (e.key === 'ArrowUp' && el.selectionStart === 0 && idx > 0) {
      e.preventDefault();
      const prev = document.querySelector(`.line-input[data-index="${idx - 1}"]`);
      if (prev) { prev.focus(); prev.setSelectionRange(prev.value.length, prev.value.length); }
    }
    if (e.key === 'ArrowDown' && el.selectionStart === el.value.length && idx < parsedLines.length - 1) {
      e.preventDefault();
      const next = document.querySelector(`.line-input[data-index="${idx + 1}"]`);
      if (next) { next.focus(); next.setSelectionRange(0, 0); }
    }
    if (e.key === 'Escape') {
      el.value = parsedLines[idx]?.text ?? '';
      el.blur();
    }
  });

  el.addEventListener('click', e => e.stopPropagation());
}

function renderLines(lines, options = {}) {
  parsedLines = lines || [];
  const container = document.getElementById('lines-container');
  const focusState = options.preserveFocus ? getEditorFocusState() : null;
  const focusIndex = options.focusIndex ?? pendingFocusIndex;
  pendingFocusIndex = -1;

  if (!parsedLines.length) {
    container.innerHTML = '<div class="placeholder" role="button" tabindex="0">Escreva o roteiro — clique aqui para começar. Arraste mídias para os nós de sync.</div>';
    container.querySelector('.placeholder')?.addEventListener('click', () => insertLineLocal(-1, ''));
    container.querySelector('.placeholder')?.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); insertLineLocal(-1, ''); }
    });
    const lc = document.getElementById('line-count');
    if (lc) lc.textContent = '0 linhas';
    renderLineGutter();
    updateFooterProgress();
    renderMinimap();
    renderTakeCards();
    return;
  }

  container.innerHTML = parsedLines.map((line, index) => {
    const links = getLineLinks(line);
    const synced = Boolean(line.start_tc || line.synced || links.length);
    const linked = links.length > 0;
    const clipLinks = links.filter(l => l.link_type === 'clip' && l.start_tc);
    const primary = clipLinks[0] || links[0] || line;
    const prevType = index > 0 ? classifyScriptLine(parsedLines[index - 1].text) : '';
    const lineType = classifyScriptLine(line.text, prevType);
    const active = index === activeLineIndex ? ' active' : '';
    const selected = selectedLines.has(index) ? ' selected' : '';
    const syncedCls = synced ? ' synced' : '';
    const linkedCls = linked ? ' linked' : '';
    const highlighted = linked && index === activeLineIndex ? ' highlighted sync-linked' : '';
    const gcOver = lineType === 'gc' && (line.text || '').trim().length >= GC_MAX_CHARS ? ' gc-over' : '';
    const placeholder = !line.text && index === parsedLines.length - 1 ? 'placeholder="Continue escrevendo..."' : '';
    const note = (line.note || '').trim();
    const noteOpen = openNoteIndex === index;
    const noteBtnCls = note ? ' has-note' : '';
    const notePanel = noteOpen
      ? `<div class="line-note-panel open">
          <div class="line-note-panel-hdr"><span>Nota · L${index + 1}</span></div>
          <textarea class="line-note-input" data-index="${index}" placeholder="Comentário…">${escapeHtml(note)}</textarea>
          <div class="line-note-actions">
            <button type="button" class="note-clear" data-index="${index}">Limpar</button>
            <button type="button" class="note-save" data-index="${index}">Salvar</button>
          </div>
        </div>`
      : '';
    const noteSnippet = note && !noteOpen
      ? `<div class="line-note-snippet" data-index="${index}" title="Editar nota">${escapeHtml(note)}</div>`
      : '';
    return `<div class="script-block" data-index="${index}">
      ${buildLineTakeSlotHtml(index, line, links)}
      <div class="script-line type-${lineType}${syncedCls}${linkedCls}${highlighted}${gcOver}${active}${selected}" data-index="${index}" data-tc="${primary.start_tc || line.start_tc || ''}" data-link-id="${primary.link_id || ''}">
      <div class="script-row"${linked ? ` data-anchor="line-${index}"` : ''}>
        <textarea class="line-input" rows="1" data-index="${index}" ${placeholder}>${escapeHtml(line.text || '')}</textarea>
        <div class="line-menu-wrap${noteBtnCls}" data-index="${index}">
          <button type="button" class="line-menu-btn" data-index="${index}" onclick="toggleLineMenu(${index}, event)" title="Opções" aria-label="Opções">⋮</button>
          <div class="line-menu-list" role="menu" onclick="event.stopPropagation()">
            <button type="button" class="line-menu-item${noteBtnCls}" data-action="note" data-index="${index}" role="menuitem">Nota${note ? ' ✓' : ''}</button>
            ${linked ? `<button type="button" class="line-menu-item" data-action="rename-sync" data-index="${index}" role="menuitem">Renomear sync</button>` : ''}
            <button type="button" class="line-menu-item" data-action="jump" data-index="${index}" role="menuitem">Jump ▶</button>
            <button type="button" class="line-menu-item danger" data-action="delete" data-index="${index}" role="menuitem">Excluir</button>
          </div>
        </div>
      </div>
      ${noteSnippet}
      ${notePanel}
    </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.line-input').forEach(bindLineInput);

  container.querySelectorAll('.line-take-slot.collapsed').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(el.dataset.lineIndex, 10);
      if (!Number.isNaN(idx)) highlightActiveLine(idx, true);
    });
  });

  container.querySelectorAll('.script-line').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.classList.contains('line-input') || e.target.closest('.line-menu-wrap')
        || e.target.closest('.line-note-panel')
        || e.target.classList.contains('line-note-snippet')) return;
      const idx = parseInt(el.dataset.index, 10);
      if (Number.isNaN(idx)) return;
      if (linkMode) {
        toggleLineSelection(idx, e);
        return;
      }
      focusLineConnections(idx);
      highlightActiveLine(idx, false);
      drawLinkConnections();
      const inp = el.querySelector('.line-input');
      if (inp) inp.focus();
    });
  });

  container.querySelectorAll('.line-menu-item').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index, 10);
      const action = btn.dataset.action;
      closeAllLineMenus();
      if (Number.isNaN(idx)) return;
      if (action === 'jump' && backend) backend.jump_to_line(idx);
      else if (action === 'rename-sync') startSyncNodeRename(idx);
      else if (action === 'delete') deleteLinesAt(selectedLines.size > 1 ? [...selectedLines] : [idx]);
      else if (action === 'note') toggleLineNote(idx);
    });
  });

  container.querySelectorAll('.line-note-snippet').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      toggleLineNote(parseInt(el.dataset.index, 10));
    });
  });

  container.querySelectorAll('.note-save').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      saveLineNote(parseInt(btn.dataset.index, 10));
    });
  });

  container.querySelectorAll('.note-clear').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      clearLineNote(parseInt(btn.dataset.index, 10));
    });
  });

  container.querySelectorAll('.line-note-input').forEach(ta => {
    ta.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        e.preventDefault();
        openNoteIndex = -1;
        renderLines(parsedLines, { preserveFocus: true });
      }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        saveLineNote(parseInt(ta.dataset.index, 10));
      }
    });
    ta.addEventListener('click', e => e.stopPropagation());
  });

  document.getElementById('line-count').textContent = `${parsedLines.length} linhas`;
  renderLineGutter();
  updateFooterProgress();

  const restore = focusIndex >= 0 ? focusIndex : focusState?.index;
  if (restore >= 0) {
    const inp = document.querySelector(`.line-input[data-index="${restore}"]`);
    if (inp) {
      inp.focus();
      const start = focusState?.start ?? inp.value.length;
      const end = focusState?.end ?? start;
      inp.setSelectionRange(start, end);
      autoResizeInput(inp);
    }
  }

  setTimeout(() => { scheduleLayoutUpdate(); applyFindFilter(); buildScenePageIndex(); renderSyncRail(); drawLinkConnections(); }, 30);
}

function highlightActiveLine(index, scrollIntoView = false) {
  if (lastActiveLineUi !== index) {
    if (lastActiveLineUi >= 0) {
      document.querySelector(`.script-line[data-index="${lastActiveLineUi}"]`)?.classList.remove('active');
    }
    if (index >= 0) {
      document.querySelector(`.script-line[data-index="${index}"]`)?.classList.add('active');
    }
    document.querySelectorAll('.line-take-slot').forEach(slot => {
      const idx = parseInt(slot.dataset.lineIndex, 10);
      const on = index >= 0 && idx === index;
      slot.classList.toggle('expanded', on);
      slot.classList.toggle('collapsed', !on);
    });
    lastActiveLineUi = index;
  }
  activeLineIndex = index;
  lastPlayheadIndex = -1;
  document.querySelectorAll('.sync-node-v0').forEach(n => {
    n.classList.toggle('active', index >= 0 && parseInt(n.dataset.lineIndex, 10) === index);
  });
  updatePlayheadRuler();
  pairLineWithSpine(index, index >= 0);
  if (!playbackActive) {
    focusLineConnections(index);
    drawLinkConnections();
  }
  if (scrollIntoView && index >= 0 && !playbackActive) {
    scrollToLine(index, true);
  } else {
    scheduleLayoutUpdate();
  }
}

function newScript() {
  if (!backend) return;
  if (parsedLines.length && !confirm('Criar novo roteiro? Alterações não salvas serão perdidas.')) return;
  backend.new_script();
}

function addLine() {
  if (!backend && !parsedLines.length) return;
  const after = activeLineIndex >= 0 ? activeLineIndex : parsedLines.length - 1;
  insertLineLocal(after, '');
}

function importScript() {
  if (!backend) return;
  backend.open_import_dialog();
}

function saveScript() {
  if (!backend) return;
  const content = parsedLines.map(l => l.text).join('\n');
  backend.save_script(content, 'txt');
}

function syncTimeline() {
  if (!backend) return;
  const mode = document.getElementById('sync-mode-select').value;
  const content = parsedLines.map(l => l.text).join('\n');
  backend.sync_timeline(content, 'txt', mode, getSyncOptionsJson());
}

function getSyncOptionsJson() {
  return JSON.stringify({
    skip_caps: document.getElementById('opt-skip-caps')?.checked !== false,
    skip_parens: document.getElementById('opt-skip-parens')?.checked !== false,
    skip_scene_headers: document.getElementById('opt-skip-scenes')?.checked !== false,
  });
}

function syncBetweenMarks() {
  if (!backend) return;
  let start = -1;
  let end = -1;
  if (selectedLines.size >= 2) {
    const sorted = [...selectedLines].sort((a, b) => a - b);
    start = sorted[0];
    end = sorted[sorted.length - 1];
  } else {
    const marks = parsedLines.map((l, i) => (lineIsLinked(l) ? i : -1)).filter(i => i >= 0);
    if (marks.length < 2) {
      setStatus('Selecione 2+ linhas ou tenha 2+ marks linkados', '#eb6f92');
      return;
    }
    start = marks[0];
    end = marks[marks.length - 1];
  }
  const mode = document.getElementById('sync-mode-select').value;
  const content = parsedLines.map(l => l.text).join('\n');
  backend.sync_timeline_range(content, mode, String(start), String(end), getSyncOptionsJson());
}

function undoLink() {
  if (backend) backend.undo_link();
}

function redoLink() {
  if (backend) backend.redo_link();
}

function toggleLineNote(index) {
  if (Number.isNaN(index) || index < 0) return;
  openNoteIndex = openNoteIndex === index ? -1 : index;
  renderLines(parsedLines, { preserveFocus: true, focusIndex: index });
  if (openNoteIndex >= 0) {
    setTimeout(() => {
      const ta = document.querySelector(`.line-note-input[data-index="${openNoteIndex}"]`);
      if (ta) {
        ta.focus();
        ta.setSelectionRange(ta.value.length, ta.value.length);
      }
    }, 40);
  }
}

function saveLineNote(index) {
  const ta = document.querySelector(`.line-note-input[data-index="${index}"]`);
  if (!ta || !backend) return;
  const value = ta.value.trim();
  parsedLines[index].note = value;
  backend.set_line_note(index, value);
  openNoteIndex = -1;
  renderLines(parsedLines, { preserveFocus: true, focusIndex: index });
  setStatus(value ? 'Nota salva' : 'Nota removida', '#9ccfd8');
}

function clearLineNote(index) {
  if (!backend) return;
  parsedLines[index].note = '';
  backend.set_line_note(index, '');
  openNoteIndex = -1;
  renderLines(parsedLines, { preserveFocus: true, focusIndex: index });
}

function exportBundle() {
  if (!backend) return;
  const content = parsedLines.map(l => l.text).join('\n');
  backend.export_bundle(content);
}

function importSrtMap() {
  if (backend) backend.import_srt_map();
}

function clearEditor() {
  parsedLines = [];
  activeLineIndex = -1;
  setSyncBadge(false);
  renderLines([]);
  if (backend) backend.clear_script();
}

if (typeof QWebChannel !== 'undefined') {
  new QWebChannel(qt.webChannelTransport, ch => {
    backend = ch.objects.backend;

    backend.connection_changed.connect((connected, text) => {
      document.getElementById('conn-dot').classList.toggle('on', connected);
      document.getElementById('conn-text').textContent = text;
      const statusDot = document.getElementById('status-dot');
      statusDot.classList.toggle('connected', connected);
      if (!connected) statusDot.classList.remove('error');
    });

    backend.status_changed.connect((message, color) => {
      setStatus(message, color);
      if (message.startsWith('Imported:') || message.startsWith('Saved')) {
        setProjectLabel(message.split(':').pop().trim());
      }
    });

    backend.script_loaded.connect(content => {
      if (!parsedLines.length && content) {
        parsedLines = content.split('\n').filter(t => t.trim()).map((text, i) => ({
          text: text.trim(), line_number: i + 1, start_tc: null, synced: false
        }));
        renderLines(parsedLines);
      }
    });

    backend.clips_updated.connect(json => {
      timelineClips = JSON.parse(json);
      renderClips(timelineClips);
      renderTimelineSpine(true);
      drawLinkConnections();
      scheduleLayoutUpdate();
    });

    backend.lines_updated.connect(json => {
      const lines = JSON.parse(json);
      parsedLines = lines;
      editingSyncNodeIndex = -1;
      const synced = lines.some(l => l.start_tc || l.link_id || (l.links && l.links.length));
      setSyncBadge(synced);
      renderLines(lines, { preserveFocus: isEditorFocused });
      renderClips(timelineClips);
      renderTimelineSpine(true);
      updateLineSelectionUi();
      if (activeLineIndex >= 0) focusLineConnections(activeLineIndex);
      drawLinkConnections();
      scheduleLayoutUpdate();
      advanceAfterTapSync();
    });

    backend.thumbnail_ready.connect((key, uri) => {
      clipThumbnails[key] = uri;
      applyClipThumbnails();
    });

    backend.timeline_info.connect(json => {
      const info = JSON.parse(json);
      document.getElementById('timeline-name').textContent = info.name || '--';
      document.getElementById('timeline-fps').textContent = info.fps != null ? `${info.fps} fps` : '-- fps';
      setTimecodeDisplay(info.current_timecode);
      if (info.duration_tc) {
        document.getElementById('timeline-duration').textContent = info.duration_tc;
      } else if (info.start_frame !== undefined && info.end_frame !== undefined) {
        document.getElementById('timeline-duration').textContent =
          (info.end_frame - info.start_frame) + ' frames';
      }
      if (info.line_count != null) {
        document.getElementById('line-count').textContent = `${info.line_count} linhas`;
      }
      if (info.is_synced != null) setSyncBadge(info.is_synced);
      if (info.sync_mode) {
        const sel = document.getElementById('sync-mode-select');
        if (sel) sel.value = info.sync_mode;
      }
    });

    backend.session_loaded.connect(msg => setStatus(msg, '#9ccfd8'));

    backend.playback_mode_changed.connect(active => {
      setPlaybackActive(active, true);
    });

    backend.timecode_changed.connect(tc => {
      pendingTcDisplay = tc;
      if (tcUiTimer) return;
      tcUiTimer = setTimeout(() => {
        tcUiTimer = null;
        setTimecodeDisplay(pendingTcDisplay);
        noteTimecodeTick();
      }, 75);
    });

    backend.active_line_changed.connect(index => {
      if (index >= 0) highlightActiveLine(index, !playbackActive);
      else highlightActiveLine(-1);
    });

    backend.sync_completed.connect((success, message) => {
      if (success) setSyncBadge(true);
      setStatus(message, success ? '#9ccfd8' : '#eb6f92');
      setFooterStatus(message || (success ? 'Sincronização concluída' : 'Erro na sincronização'));
    });

    backend.js_ready();
    backend.get_timeline_info();
    backend.refresh_clips();
    maybeShowIntroOnStartup();
  });
}

const linesEl = document.getElementById('lines-container');
const workspaceBody = document.getElementById('workspace-body');
const clipsListEl = document.getElementById('clips-list');

function syncEditorScroll(source, scrollTop) {
  if (syncingScroll) return;
  syncingScroll = true;
  if (workspaceBody && source !== workspaceBody) workspaceBody.scrollTop = scrollTop;
  syncingScroll = false;
  scheduleScrollSync();
}

workspaceBody?.addEventListener('scroll', () => {
  if (syncingScroll || !workspaceBody) return;
  updateMinimapViewport();
  computeWorkspacePaths();
  positionSpineNodes();
}, { passive: true });
clipsListEl?.addEventListener('scroll', () => scheduleScrollSync(), { passive: true });
document.getElementById('script-minimap')?.addEventListener('click', e => {
  const body = document.getElementById('workspace-body');
  const ticks = document.getElementById('minimap-ticks');
  if (!body || !ticks) return;
  const rect = ticks.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const ratio = y / Math.max(ticks.offsetHeight, 1);
  body.scrollTop = ratio * body.scrollHeight;
  updateMinimapViewport();
});
document.addEventListener('keydown', e => {
  if (e.key === 'F3') {
    e.preventDefault();
    syncTimeline();
    closeAllMenus();
  }
  if (e.key === 'F5') {
    e.preventDefault();
    linkToPlayhead();
  }
  if (e.key === 'F2' && activeLineIndex >= 0 && lineIsLinked(parsedLines[activeLineIndex])) {
    e.preventDefault();
    startSyncNodeRename(activeLineIndex);
  }
  if (playbackActive) onTapSyncKey(e);
});
window.addEventListener('resize', () => {
  clearTimeout(resizeEndTimer);
  resizeEndTimer = setTimeout(() => scheduleLayoutUpdate(), 200);
}, { passive: true });
document.getElementById('intro-overlay')?.addEventListener('click', e => {
  if (e.target.id === 'intro-overlay') closeIntro();
});
function initWorkspaceObservers() {
  const body = document.getElementById('workspace-body');
  const lines = document.getElementById('lines-container');
  if (body && body.dataset.roBound !== '1') {
    body.dataset.roBound = '1';
    new ResizeObserver(() => scheduleLayoutUpdate()).observe(body);
  }
  if (lines && lines.dataset.roBound !== '1') {
    lines.dataset.roBound = '1';
    new MutationObserver(() => scheduleLayoutUpdate()).observe(lines, { childList: true, subtree: true });
  }
}

loadPanelState();
initMediaPoolDragDrop();
initClipListInteractions();
initWorkspaceObservers();
renderIntroContent();
</script>
</body>
</html>
