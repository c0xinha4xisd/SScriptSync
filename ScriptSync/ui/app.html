<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<title>SScriptSync v3</title>
<style>
@font-face{font-family:'Monaspace';src:url('Monaspace_Neon_Var.woff2') format('woff2');font-weight:100 900;font-style:normal}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --base:#0e0e12;--surface:#15151c;--surface-2:#1c1c26;--overlay:#22222e;
  --muted:#7a7896;--text:#e8e6f0;--subtle:color-mix(in srgb,var(--muted) 55%,var(--text));
  --love:#eb6f92;--gold:#f6c177;--playhead:#facc15;
  --foam:#7dd3c8;--iris:#c4a7e7;
  --border:#2a2840;--hl-low:#252238;--hl-med:#34324a;--hl-high:#4a4763;
  --accent:#7dd3c8;--accent-dim:color-mix(in srgb,var(--accent),transparent 82%);
  --r:6px;
  color-scheme:dark;
}
html,body{width:100%;height:100%;margin:0;background:var(--base);color:var(--text);
  font-family:'Monaspace','JetBrains Mono','Segoe UI',sans-serif;font-size:12px;overflow:hidden}
#root{display:flex;flex-direction:column;width:100%;height:100%;
  border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative;background:var(--base)}

/* ── Titlebar ── */
#titlebar{display:flex;align-items:center;gap:8px;height:32px;flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);padding:0 10px;
  position:relative;z-index:510}
#toolbar{display:flex;align-items:stretch;min-height:36px;flex-shrink:0;
  background:var(--surface-2);border-bottom:1px solid var(--border);padding:0;
  position:relative;z-index:500;box-shadow:0 1px 0 var(--border);overflow:visible}
.toolbar-scroll{display:flex;align-items:center;gap:6px;flex:1;min-width:0;padding:0 10px;
  overflow-x:auto;overflow-y:visible}
.mode-btn{font-size:11px;padding:3px 10px;border-radius:3px;cursor:pointer;
  border:1px solid var(--border);color:var(--subtle);background:var(--overlay);font-family:inherit;white-space:nowrap}
.mode-btn.primary{color:var(--text);border-color:color-mix(in srgb,var(--accent),transparent 55%)}
.mode-btn.primary:hover{background:color-mix(in srgb,var(--accent),transparent 88%);color:var(--accent)}
.mode-btn:hover{color:var(--text);background:var(--hl-med)}
.mode-btn.active{border-color:var(--accent);color:var(--base);background:var(--accent)}
.mode-btn.danger:hover{color:var(--love);border-color:var(--love)}
.tb-menu{position:relative;flex-shrink:0;z-index:1}
.tb-menu.open{z-index:520}
.menu-trigger{font-size:11px;padding:4px 11px;border-radius:5px;cursor:pointer;
  border:1px solid var(--border);color:var(--subtle);background:var(--overlay);font-family:inherit;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,background .15s,color .15s}
.menu-trigger::after{content:'▾';font-size:9px;opacity:.65;line-height:1}
.menu-trigger:hover,.tb-menu.open .menu-trigger{color:var(--text);background:var(--hl-med);border-color:var(--hl-high)}
.tb-menu.open .menu-trigger{color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 45%);
  background:color-mix(in srgb,var(--accent),transparent 92%)}
.menu-list{display:none;min-width:220px;max-width:280px;
  background:var(--surface-2);border:1px solid color-mix(in srgb,var(--accent),transparent 78%);
  border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);
  padding:6px;animation:menuIn .14s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu-list button,.menu-list .menu-item{display:flex;align-items:center;gap:8px;width:100%;
  text-align:left;padding:8px 10px;border:none;background:transparent;color:var(--text);
  font-family:inherit;font-size:11px;cursor:pointer;border-radius:5px;line-height:1.35}
.menu-list button:hover,.menu-list .menu-item:hover{background:var(--hl-med);color:var(--accent)}
.menu-list button:active{background:color-mix(in srgb,var(--accent),transparent 88%)}
.menu-list button:disabled{opacity:.4;cursor:default}
.menu-list button.danger{color:color-mix(in srgb,var(--love),var(--text) 40%)}
.menu-list button.danger:hover{color:var(--love);background:color-mix(in srgb,var(--love),transparent 88%)}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}
.menu-label{font-size:9px;font-weight:700;color:var(--muted);padding:8px 10px 4px;letter-spacing:.55px;text-transform:uppercase}
.menu-check{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:11px;color:var(--subtle);
  cursor:pointer;border-radius:5px;margin:1px 0}
.menu-check:hover{background:var(--hl-med);color:var(--text)}
.menu-check input{accent-color:var(--accent);width:14px;height:14px}
.menu-mode-on::before{content:'✓';color:var(--accent);font-weight:700;margin-right:2px;width:12px}
.menu-kbd{margin-left:auto;font-size:9px;color:var(--muted);opacity:.7}
#conn-dot.on{background:var(--accent)}
#current-tc{font-size:18px;font-weight:700;color:var(--accent);text-align:center;
  padding:15px 0;border:1px solid var(--border);border-radius:var(--r);
  background:var(--overlay);margin:10px 0}
.line-input{font-family:'Monaspace','JetBrains Mono','Segoe UI',sans-serif}
.clip-track{display:inline-block;font-size:8px;font-weight:700;color:var(--accent);
  background:var(--hl-med);padding:1px 4px;border-radius:2px;margin-right:4px}
.tb-group{display:flex;align-items:center;gap:4px;padding:0 6px;border-right:1px solid var(--border)}
.tb-spacer{flex:1;min-width:8px}
#find-input{width:140px;max-width:28vw;background:var(--overlay);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:inherit;font-size:10px;padding:4px 8px}
#find-input:focus{outline:none;border-color:var(--border)}
#find-input::placeholder{color:var(--muted)}
#project-label{font-size:10px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar-select{background:var(--overlay);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:10px;padding:3px 6px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--hl-med);border-radius:4px}

/* ── Main layout ── */
#main{display:flex;flex:1;min-height:0;position:relative;overflow:hidden;background:var(--base);z-index:1}
#link-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:visible}
#link-svg path.link-norm{stroke-width:1.5;opacity:.82}
#link-svg path.link-dim{stroke-width:1.15;opacity:.22}
#link-svg path.link-hi{stroke-width:2.5;opacity:1;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--gold),transparent 35%))}
#link-svg .link-anchor{fill:var(--foam);opacity:.95}
#link-svg .link-anchor-dim{fill:var(--muted);opacity:.45}

#appname{font-size:13px;font-weight:800;letter-spacing:.02em}
#ss{color:var(--accent)}
.badge{font-size:9px;background:var(--hl-low);color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:2px 6px}
#version{font-size:9px;color:var(--muted)}
.spacer{flex:1}
#conn-row{display:flex;align-items:center;gap:6px}
#conn-dot{width:7px;height:7px;border-radius:50%;background:var(--hl-med)}
#conn-dot.on{background:#6bcb6b}
#conn-text{font-size:10px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Timeline panel ── */
#timeline-panel{width:var(--timeline-w,220px);flex-shrink:0;background:var(--surface);
  border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
#timeline-hdr{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--muted);
  padding:7px 8px 4px;border-bottom:1px solid var(--border)}
#timeline-content{flex:1;overflow:hidden;padding:6px 8px;display:flex;flex-direction:column;min-height:0}
.info-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--hl-low)}
.info-label{font-size:9px;color:var(--muted);flex-shrink:0;width:54px}
.info-value{font-size:10px;color:var(--text);flex:1;font-family:inherit;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Text Editor ── */
#editor-panel{flex:1;display:flex;flex-direction:column;background:var(--base);min-width:0;position:relative}
#editor-container{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
#sync-thumbs-row{display:flex;gap:4px;padding:4px 8px;min-height:52px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
#sync-thumbs-row:empty{display:none}
.sync-thumb-card{flex-shrink:0;width:72px;text-align:center;cursor:pointer}
.sync-thumb-img{width:64px;height:36px;border-radius:2px;border:1px solid var(--border);
  background:linear-gradient(135deg,var(--hl-med),var(--overlay));display:flex;align-items:center;
  justify-content:center;font-size:8px;color:var(--subtle);overflow:hidden}
.sync-thumb-img.linked{box-shadow:0 0 0 2px var(--accent)}
.sync-thumb-card.conn-highlight .sync-thumb-img{box-shadow:0 0 0 2px var(--gold)}
.sync-thumb-label{display:block;font-size:8px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:72px}
#editor-body{display:flex;flex:1;min-height:0;position:relative}
#playhead-band{display:none;position:absolute;left:0;right:0;z-index:0;pointer-events:none;
  background:color-mix(in srgb,var(--playhead),transparent 92%);
  box-shadow:inset 3px 0 0 color-mix(in srgb,var(--playhead),transparent 12%)}
#lines-container,#sync-panel{position:relative;z-index:1}
#lines-container{flex:1;overflow-y:auto;padding:16px 28px 16px 6px}
#sync-panel{flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;min-width:88px;max-width:360px}
#sync-hdr{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--muted);
  padding:6px 6px 4px;border-bottom:1px solid var(--border);text-align:center}
#sync-tracks{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding:8px 4px}
#sync-tracks::-webkit-scrollbar{width:0}
.sync-col{position:absolute;top:8px;width:26px}
.sync-track{width:2px;margin:0 auto;background:var(--hl-high);min-height:100px;border-radius:1px}
.sync-node{width:10px;height:10px;margin:0 auto;border-radius:1px;border:1px solid var(--text);
  position:absolute;left:50%;transform:translate(-50%,-50%);cursor:pointer;z-index:2}
.sync-node.sync-mark{width:0;height:0;background:transparent !important;border:none;border-radius:0;
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-bottom:9px solid var(--mark-color,var(--gold));filter:drop-shadow(0 0 1px rgba(0,0,0,.4))}
.sync-node.sync-mark:hover{filter:drop-shadow(0 0 4px var(--accent))}
.sync-node:hover{box-shadow:0 0 6px var(--accent)}
#lines-container .placeholder{padding:24px;color:var(--muted);font-size:11px}
.script-line.find-hidden{display:none}
.script-line.playhead-row{background:transparent;box-shadow:none}
.script-line{display:grid;grid-template-columns:22px 118px 1fr auto;align-items:start;
  column-gap:20px;row-gap:2px;padding:14px 8px 14px 4px;margin-bottom:18px;
  border-radius:var(--r);border:1px solid transparent;cursor:text;transition:background .12s,border-color .12s}
.script-line:focus-within{background:var(--hl-low);border-color:var(--hl-med)}
.script-line.synced{cursor:text;border-left:3px solid transparent}
.script-line.linked{border-left-width:4px}
.script-line.selected{background:var(--hl-med);outline:1px dashed var(--gold)}
.script-line.conn-highlight{background:color-mix(in srgb,var(--gold),transparent 90%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold),transparent 55%)}
.script-line.conn-highlight .line-tc.has-tc{color:var(--gold);font-weight:600}
.script-line.linked .line-text{font-weight:600}
.script-line.synced:hover{background:var(--overlay)}
.line-actions{grid-column:4;display:flex;flex-direction:row;align-items:stretch;align-self:start;
  margin-top:3px;border:1px solid var(--border);border-radius:3px;overflow:hidden;
  background:var(--surface);opacity:.42;transition:opacity .15s,border-color .15s}
.script-line:hover .line-actions,.script-line.active .line-actions,.script-line.selected .line-actions{opacity:1}
.line-icon-btn{width:22px;height:20px;border:none;border-radius:0;background:transparent;
  color:var(--muted);cursor:pointer;font-size:11px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;transition:color .12s,background .12s}
.line-icon-btn + .line-icon-btn{border-left:1px solid var(--border)}
.line-icon-btn:hover{background:var(--hl-med);color:var(--text)}
.line-jump-btn{color:var(--accent)}
.line-del-btn:hover{color:var(--love);background:color-mix(in srgb,var(--love),transparent 88%) !important}
.line-note-btn.has-note,.line-note-btn.open{color:var(--gold)}
.clip-item.linked{border-color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent),transparent 60%)}
.clip-item.conn-highlight{border-color:var(--gold);background:color-mix(in srgb,var(--gold),transparent 92%);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--gold),transparent 40%)}
.clip-item.selected-link{border-color:var(--gold);background:var(--hl-low)}
.clip-jump{float:right;font-size:9px;color:var(--accent);cursor:pointer;padding:2px 4px;border:1px solid var(--border);border-radius:2px}
.clip-jump:hover{background:var(--overlay)}
#link-hint{font-size:9px;color:var(--gold);margin-left:8px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.script-line.active{background:transparent;box-shadow:inset 3px 0 0 var(--accent)}
.script-line.active .line-input{color:var(--text)}
.script-line.multi-take .line-tc::after{content:'';display:inline-block;width:6px;height:6px;
  margin-left:4px;border-radius:50%;background:var(--gold);vertical-align:middle}
.line-tc-col{grid-column:2;display:flex;flex-direction:column;gap:4px;padding:4px 24px 4px 0;
  border-right:1px solid var(--hl-low);align-self:stretch;justify-content:center;min-width:0;width:118px}
.line-tc{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.35;
  display:inline-block;width:fit-content;max-width:100%}
.line-tc.has-tc{color:var(--foam);position:relative}
.line-tc-display{padding:0;border:none;border-radius:0;background:none;box-shadow:none;
  position:relative;display:inline-block;width:fit-content;max-width:100%}
.line-tc.has-tc::before{content:'';position:absolute;left:-24px;top:50%;width:24px;height:1px;
  background:color-mix(in srgb,var(--foam),transparent 55%);transform:translateY(-50%);opacity:.45}
.script-line.conn-highlight .line-tc.has-tc::before{
  opacity:.95;height:2px;background:var(--gold)}
.line-tc-display.link-anchor-hot,.script-line.conn-highlight .line-tc.has-tc{color:var(--gold);font-weight:600}
.line-tc-extra{font-size:8px;color:var(--gold);opacity:.9;line-height:1.25;display:block;
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.line-num-col{grid-column:1;font-size:9px;color:var(--muted);text-align:right;padding-top:5px;padding-right:2px;
  opacity:.55;user-select:none}
.line-input{grid-column:3}
.line-note-panel{grid-column:3 / 5;display:none;margin-top:2px;padding:8px 10px;
  background:color-mix(in srgb,var(--surface-2),transparent 8%);border:1px solid var(--border);
  border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.line-note-panel.open{display:block}
.line-note-panel-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.line-note-panel-hdr span{font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
.line-note-input{width:100%;min-height:52px;max-height:120px;resize:vertical;
  background:var(--overlay);border:1px solid var(--border);border-radius:4px;color:var(--text);
  font-family:inherit;font-size:11px;line-height:1.5;padding:8px;outline:none}
.line-note-input:focus{border-color:color-mix(in srgb,var(--accent),transparent 40%)}
.line-note-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.line-note-actions button{font-size:10px;padding:4px 10px;border-radius:4px;cursor:pointer;
  border:1px solid var(--border);background:var(--overlay);color:var(--subtle);font-family:inherit}
.line-note-actions button:hover{color:var(--text);background:var(--hl-med)}
.line-note-actions .note-save{color:var(--base);background:var(--accent);border-color:var(--accent)}
.line-note-actions .note-save:hover{filter:brightness(1.05)}
.line-note-snippet{grid-column:3;font-size:10px;color:var(--gold);opacity:.82;padding:2px 8px 0;
  line-height:1.45;cursor:pointer;border-left:2px solid color-mix(in srgb,var(--gold),transparent 50%);
  margin-left:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-note-snippet:hover{opacity:1;white-space:normal}
.line-text,.line-input{flex:1;font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word}
.line-input{
  border:none;background:transparent;font-family:inherit;resize:none;overflow:hidden;
  padding:4px 8px;margin:0;min-height:28px;width:100%;outline:none;field-sizing:content}
.line-input::placeholder{color:var(--muted);opacity:.6}
.line-input:focus{background:color-mix(in srgb,var(--overlay),transparent 30%);border-radius:2px}
.line-num-col,.line-tc,.line-tc-col,.line-actions,.line-icon-btn{user-select:none}
.clip-item .clip-thumb-wrap{position:relative;width:100%;height:46px;
  border-radius:3px;overflow:hidden;border:1px solid var(--border);background:var(--hl-med)}
.clip-item .clip-thumb{width:100%;height:100%;object-fit:cover;display:block;margin:0;border:none;border-radius:0;
  background:var(--hl-med) center/cover no-repeat}
.clip-track-badge{position:absolute;top:4px;left:4px;font-size:7px;font-weight:700;
  color:var(--accent);background:rgba(14,14,18,.82);padding:2px 4px;border-radius:2px}
.clip-item .clip-jump{position:absolute;bottom:4px;right:4px;float:none;margin:0;
  font-size:8px;padding:2px 5px;background:rgba(14,14,18,.82);border-color:var(--border)}
.clip-item .clip-meta{padding:4px 2px 2px}
.clip-item .clip-name{font-size:9px;line-height:1.3;margin-top:0}
.clip-item .clip-tc{font-size:8px;margin-top:2px;line-height:1.35;opacity:.85}
.resync-btn{font-weight:700;color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 60%)}
.resync-btn:hover{background:color-mix(in srgb,var(--accent),transparent 88%)}
.sync-thumb-img img{width:100%;height:100%;object-fit:cover;border-radius:2px}
#sync-badge{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 6px;border-radius:var(--r);
  border:1px solid var(--border);color:var(--muted);margin-left:6px}
#sync-badge.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 70%)}
#sync-mode-select{background:var(--overlay);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:10px;padding:3px 7px}
.sync-opt{font-size:9px;color:var(--muted);display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.sync-opt input{accent-color:var(--accent)}
#clips-section{margin-top:8px;border-top:1px solid var(--border);padding-top:6px;
  flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#clips-hdr-row{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:5px}
#clips-hdr-row #clips-hdr{font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--muted);line-height:1.2}
#clips-sub{font-size:8px;color:var(--muted);opacity:.75;margin-top:2px;line-height:1.2}
#clips-toolbar{display:flex;flex-direction:column;gap:4px;margin-bottom:5px;flex-shrink:0}
.clips-toolbar-row{display:flex;align-items:center;gap:4px}
#clip-find-input{flex:1;min-width:0;width:auto;background:var(--overlay);border:1px solid var(--border);border-radius:3px;
  color:var(--text);font-family:inherit;font-size:10px;padding:4px 6px}
#clip-find-input:focus{outline:none;border-color:color-mix(in srgb,var(--accent),transparent 50%)}
#clip-find-input::placeholder{color:var(--muted)}
.clip-type-filters{display:flex;gap:3px;flex-wrap:wrap}
.clip-type-btn{font-size:8px;padding:2px 6px;border-radius:3px;cursor:pointer;border:1px solid var(--border);
  background:var(--overlay);color:var(--muted);font-family:inherit;white-space:nowrap}
.clip-type-btn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 45%)}
.clip-refresh{font-size:9px;padding:3px 7px;cursor:pointer;border:1px solid var(--border);
  border-radius:var(--r);background:var(--overlay);color:var(--muted);flex-shrink:0;white-space:nowrap}
.clip-refresh:hover{color:var(--accent);border-color:var(--accent-dim)}
.nav-select{max-width:130px;background:var(--overlay);border:1px solid var(--border);border-radius:var(--r);
  color:var(--text);font-family:inherit;font-size:10px;padding:3px 6px}
.sync-col{width:40px}
.sync-track-full{position:absolute;left:50%;width:2px;top:0;bottom:0;transform:translateX(-50%);
  background:var(--hl-high);opacity:.45;border-radius:1px}
#clips-list{flex:1;overflow-y:auto;min-height:120px;padding-right:1px;padding-bottom:8px}
.clip-item{padding:3px;margin-bottom:14px;border-radius:var(--r);border:1px solid var(--border);
  cursor:pointer;transition:background .15s,border-color .15s}
.clip-item.clip-hidden{display:none}
.clip-item.focused{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold),transparent 35%)}
.clip-item.audio .clip-thumb-wrap{background:linear-gradient(135deg,var(--hl-med),color-mix(in srgb,var(--iris),transparent 88%))}
.clip-item.audio .clip-thumb{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--iris);
  background:transparent !important;object-fit:none}
.clip-track-badge.audio-badge{color:var(--iris)}
.clip-item:hover{background:var(--overlay);border-color:var(--hl-med)}
.clip-name{display:block;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-tc{display:block;color:var(--muted)}
body.link-mode .line-input{pointer-events:none;cursor:default;opacity:.92}
body.link-mode .script-line{cursor:pointer}
.line-text[contenteditable="true"]{outline:1px solid var(--accent);background:var(--overlay);border-radius:2px;padding:2px 4px}
/* ── Status bar ── */
#status-bar{height:24px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 10px;gap:10px}
#status-text{font-size:10px;color:var(--muted);flex:1}
#status-dot{width:6px;height:6px;border-radius:50%;background:var(--hl-med)}
#status-dot.connected{background:var(--accent)}
#status-dot.error{background:var(--love)}

/* ── Intro / Quick Reference (MFlow-style) ── */
.titlebar-btn{font-size:11px;width:22px;height:22px;padding:0;border:1px solid var(--border);
  border-radius:4px;background:var(--overlay);color:var(--muted);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;line-height:1;transition:color .12s,background .12s,border-color .12s}
.titlebar-btn:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 55%);background:var(--hl-med)}
.intro-overlay{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(6,6,10,.72);backdrop-filter:blur(4px);animation:introFade .18s ease-out}
.intro-overlay.hidden{display:none}
@keyframes introFade{from{opacity:0}to{opacity:1}}
.intro-modal{width:min(720px,calc(100vw - 32px));max-height:min(88vh,640px);display:flex;flex-direction:column;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--accent),transparent 72%);
  border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.04);overflow:hidden}
.intro-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:var(--surface-2);flex-shrink:0}
.intro-hdr .intro-brand{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--text)}
.intro-hdr .intro-brand span{color:var(--accent)}
.intro-hdr .intro-sub{font-size:10px;color:var(--muted);letter-spacing:.35px;text-transform:uppercase;margin-left:4px}
.intro-hdr .intro-spacer{flex:1}
.intro-close{width:26px;height:26px;border:none;border-radius:5px;background:transparent;color:var(--muted);
  cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.intro-close:hover{color:var(--text);background:var(--hl-med)}
.intro-lead{padding:14px 18px 0;font-size:11px;line-height:1.55;color:var(--subtle);flex-shrink:0}
.intro-body{flex:1;overflow-y:auto;padding:14px 18px 10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.intro-body{grid-template-columns:1fr}}
.intro-section{background:var(--overlay);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.intro-section.full{grid-column:1 / -1}
.intro-section-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:9px;font-weight:700;
  letter-spacing:.55px;text-transform:uppercase;color:var(--muted)}
.intro-section-hdr .ico{font-size:11px;opacity:.85}
.intro-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;font-size:10px;line-height:1.45;color:var(--subtle)}
.intro-row:last-child{margin-bottom:0}
.intro-keys{display:flex;flex-wrap:wrap;gap:3px;flex-shrink:0;max-width:46%}
.intro-kbd{font-size:9px;font-family:inherit;color:var(--text);background:var(--surface-2);
  border:1px solid var(--hl-high);border-radius:4px;padding:2px 6px;white-space:nowrap;
  box-shadow:0 1px 0 rgba(0,0,0,.35)}
.intro-desc{flex:1;color:var(--text);padding-top:1px}
.intro-tips{font-size:10px;line-height:1.55;color:var(--subtle)}
.intro-tips li{margin:0 0 4px 16px}
.intro-tips li:last-child{margin-bottom:0}
.intro-ftr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;
  border-top:1px solid var(--border);background:var(--surface-2);flex-shrink:0}
.intro-skip{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);cursor:pointer;user-select:none}
.intro-skip input{accent-color:var(--accent);width:14px;height:14px}
.intro-gotit{font-size:11px;font-weight:700;padding:7px 18px;border-radius:6px;cursor:pointer;
  border:1px solid color-mix(in srgb,var(--accent),transparent 40%);background:var(--accent);color:var(--base);font-family:inherit}
.intro-gotit:hover{filter:brightness(1.06)}

<script>
'use strict';

let backend = null;
let parsedLines = [];
let timelineClips = [];
let isSynced = false;
let activeLineIndex = -1;
let linkMode = false;
let selectedLines = new Set();
let lastSelectedIndex = -1;
let pendingFocusIndex = -1;
let clipThumbnails = {};
let syncDebounceTimer = null;
let isEditorFocused = false;
let layoutTimer = null;
let syncingScroll = false;
let resizeEndTimer = null;
let sceneIndex = [];
let pageIndex = [];
let currentSceneIdx = -1;
let lastPlayheadIndex = -1;
let lastActiveLineUi = -1;
let lastRailKey = '';
let scrollRaf = null;
let focusedClipIndex = -1;
let openNoteIndex = -1;
let clipFilterType = 'all';
let playbackActive = false;
let lastTcTickMs = 0;
let tcBurstCount = 0;
let playbackIdleTimer = null;
let tcUiTimer = null;
let pendingTcDisplay = '';
const LINK_STUB = 18;
const LINE_BAR_INSET = 7;
const CLIP_EDGE_OUTSET = 3;
const SYNC_COL_W = 28;
const INTRO_STORAGE_KEY = 'ssync_skip_intro';
const CAM_COLORS = ['#ffc107', '#2196f3', '#4caf50', '#e91e63', '#9c27b0'];
const GC_MAX_CHARS = 56;
let pairedLineIndex = -1;
let tapSyncPendingAdvance = false;
let editingSyncNodeIndex = -1;

function setTimecodeDisplay(tc) {
  const v = tc || '--:--:--:--';
  const videoTc = document.getElementById('video-tc');
  if (videoTc) videoTc.textContent = v;
}

function cameraColorForClip(clip) {
  if (!clip) return '#666';
  if (clip.is_audio || clip.track_type === 'audio') return '#4caf50';
  const label = (clip.track_label || 'V1').toUpperCase();
  const n = parseInt(label.replace(/\D/g, ''), 10);
  if (label.startsWith('V')) {
    if (n === 1 || n % 3 === 1) return '#ffc107';
    if (n === 2 || n % 3 === 2) return '#2196f3';
    return '#4caf50';
  }
  return CAM_COLORS[(n || 0) % CAM_COLORS.length];
}

function camLabelForClip(clip) {
  if (!clip) return '';
  if (clip.is_audio || clip.track_type === 'audio') return 'Áudio';
  const label = (clip.track_label || 'V1').toUpperCase();
  const n = parseInt(label.replace(/\D/g, ''), 10) || 1;
  return `Câm ${String.fromCharCode(64 + Math.min(n, 26))}`;
}

function clipDisplayName(clip, link) {
  const raw = (link?.link_label || clip?.name || link?.clip_name || '').trim();
  if (!raw) return '';
  return raw.replace(/\.[^.]+$/, '');
}

function syncNodeLabel(line, clip, link) {
  if (link?.link_label) return truncateLabel(link.link_label, 16);
  const name = clipDisplayName(clip, link);
  if (name) return truncateLabel(name, 16);
  if (link?.track_label) return truncateLabel(link.track_label, 12);
  if (clip) return truncateLabel(camLabelForClip(clip), 10);
  if (line && getLineLinks(line).length) return 'Sync';
  return '—';
}

function syncNodeFullTitle(line, clip, link) {
  if (link?.link_label) return link.link_label;
  const name = clipDisplayName(clip, link);
  if (name) return name;
  if (clip?.name) return clip.name;
  if (link?.clip_name) return link.clip_name;
  return syncNodeLabel(line, clip, link);
}

function clipDurationLabel(clip) {
  if (!clip) return '';
  if (clip.duration_tc) return clip.duration_tc;
  if (clip.start_frame != null && clip.end_frame != null) {
    const frames = Math.max(0, clip.end_frame - clip.start_frame);
    const fps = 24;
    const sec = Math.round(frames / fps);
    if (sec < 60) return `${sec}s`;
    return `${Math.floor(sec / 60)} min`;
  }
  return '';
}

function classifyScriptLine(text, prevType = '') {
  const t = (text || '').trim();
  if (!t) return 'action';
  if (/^(GC|CG)[\s:]/i.test(t) || t.startsWith('<<')) return 'gc';
  if (/^(CENA\s*\d|INT\.|EXT\.|INT\/EXT)/i.test(t) || /^CENA \d+/i.test(t)) return 'scene_heading';
  if (/^[A-ZÀ-Ú][A-ZÀ-Ú0-9\s.\-'']+$/.test(t.replace(/:$/, '')) && t.endsWith(':') && t.length < 42) return 'character';
  if (prevType === 'character') return 'dialogue';
  if (t === t.toUpperCase() && t.length > 8 && !t.includes(':')) return 'scene_heading';
  return 'action';
}

function sceneLabelForClip(clip, index = 0) {
  const m = (clip?.name || '').match(/CENA\s*\d+/i);
  if (m) return m[0].toUpperCase().replace(/cena/i, 'CENA');
  return `CENA ${String(index + 1).padStart(2, '0')}`;
}

function takeDetailsForClip(clip) {
  if (!clip) return '';
  const fps = document.getElementById('timeline-fps')?.textContent?.replace(/\D/g, '') || '24';
  const dur = clipDurationLabel(clip);
  return `${fps} fps · ${dur || 'duração'}`;
}

function takeIdForClip(clip, index, link) {
  if (link?.link_label) return truncateLabel(link.link_label, 18);
  const name = (clip?.name || link?.clip_name || '').trim();
  if (name) return truncateLabel(name.replace(/\.[^.]+$/, ''), 18);
  if (!clip) return `Take ${index + 1}`;
  const cam = camLabelForClip(clip).replace('âm ', '');
  return `TAKE ${cam}-${index + 1}`;
}

function renderSpineBottomTakes() {
  renderTakeCards();
}

function getLineCoverageColors(line) {
  const colors = [];
  getLineLinks(line).forEach(link => {
    const clip = timelineClips.find(c => linkMatchesClip(link, c));
    const c = link.link_color || (clip ? cameraColorForClip(clip) : '');
    if (c && !colors.includes(c)) colors.push(c);
  });
  if (!colors.length && (line.link_color || line.start_tc)) {
    colors.push(line.link_color || '#2196f3');
  }
  return colors;
}

function pairLineWithSpine(index, on = true) {
  pairedLineIndex = on ? index : -1;
  document.querySelectorAll('.sync-node-v0').forEach(n => {
    n.classList.toggle('active', on && parseInt(n.dataset.lineIndex, 10) === index);
  });
  document.querySelectorAll('.script-line').forEach(el => {
    el.classList.toggle('sync-paired', on && parseInt(el.dataset.index, 10) === index);
  });
  renderTakeCards();
}

function updateFooterProgress() {
  const total = parsedLines.length || 1;
  const synced = parsedLines.filter(l => getLineLinks(l).length || l.start_tc).length;
  const pct = Math.round((synced / total) * 100);
  const fill = document.getElementById('footer-progress-fill');
  const topFill = document.getElementById('v0-top-progress-fill');
  const pctEl = document.getElementById('footer-progress-pct');
  if (fill) fill.style.width = `${pct}%`;
  if (topFill) topFill.style.width = `${pct}%`;
  if (pctEl) pctEl.textContent = `${pct}%`;
}

function colorClassForClip(clip) {
  if (!clip || clip.is_audio || clip.track_type === 'audio') return 'green';
  const label = (clip.track_label || 'V1').toUpperCase();
  const n = parseInt(label.replace(/\D/g, ''), 10) || 1;
  if (n === 1 || n % 3 === 1) return 'yellow';
  if (n === 2 || n % 3 === 2) return 'blue';
  return 'green';
}

function takeRowForLink(link, idx) {
  const clip = timelineClips.find(c => linkMatchesClip(link, c));
  const tkey = clip ? thumbKeyForClip(clip) : '';
  const thumb = clip ? thumbHtml(clip, '#666', '') : '';
  return {
    title: takeIdForClip(clip, idx, link),
    duration: clip ? clipDurationLabel(clip) : '',
    meta: clip ? takeDetailsForClip(clip) : '',
    thumbHtml: `<div class="spine-thumb-img${clip ? '' : ' empty'}" data-thumb-key="${tkey}">${thumb || ''}</div>`,
    clip,
    colorClass: colorClassForClip(clip),
  };
}

function buildTakeCardHtml(rows, anchorId) {
  const body = rows.map((row, i) => `
    <div class="take-row-v0">
      <div class="take-thumb-v0">${row.thumbHtml || ''}</div>
      <div class="take-info-v0">
        <div class="take-title-v0">${escapeHtml(row.title)}</div>
        ${row.duration ? `<div class="take-dur-v0">${escapeHtml(row.duration)}</div>` : ''}
        ${row.meta ? `<div class="take-meta-v0">${escapeHtml(row.meta)}</div>` : ''}
      </div>
    </div>`).join('');
  return `<div class="take-card-v0"${anchorId ? ` data-anchor="${anchorId}"` : ''}>${body}</div>`;
}

function buildLineTakeSlotHtml(index, line, links) {
  const clipLinks = links.filter(l => l.link_type === 'clip');
  const isActive = index === activeLineIndex;
  const isSelected = selectedLines.has(index);

  if (linkMode && isSelected && !clipLinks.length) {
    return `<div class="line-take-slot pending expanded" data-line-index="${index}">
      <div class="take-card-v0 take-pending"><div class="take-title-v0">Clique ou arraste um clip</div></div>
    </div>`;
  }

  if (!clipLinks.length) return '';

  const rows = clipLinks.map((l, j) => takeRowForLink(l, index + j));
  const stateCls = isActive ? ' expanded' : ' collapsed';
  return `<div class="line-take-slot${stateCls}" data-line-index="${index}">${buildTakeCardHtml(rows, `take-line-${index}`)}</div>`;
}

function renderTakeCards() {
  parsedLines.forEach((line, index) => {
    const block = document.querySelector(`.script-block[data-index="${index}"]`);
    if (!block) return;
    const html = buildLineTakeSlotHtml(index, line, getLineLinks(line));
    const prev = block.querySelector('.line-take-slot');
    if (html) {
      if (prev) prev.outerHTML = html;
      else block.insertAdjacentHTML('afterbegin', html);
    } else if (prev) {
      prev.remove();
    }
  });
  applyClipThumbnails();
}

const MINIMAP_TICK_PALETTE = ['#5b6472', '#3d3d44', '#4a9fe8', '#4a4a52', '#4ade80', '#f5b83d'];

function renderMinimap() {
  const ticksEl = document.getElementById('minimap-ticks');
  const markersEl = document.getElementById('minimap-markers');
  const body = document.getElementById('workspace-body');
  if (!ticksEl) return;

  const n = Math.max(parsedLines.length, 32);
  ticksEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const line = parsedLines[i];
    const colors = line ? getLineCoverageColors(line) : [];
    const c = colors[0] || MINIMAP_TICK_PALETTE[i % MINIMAP_TICK_PALETTE.length];
    const w = 30 + ((i * 17) % 55);
    const tick = document.createElement('div');
    tick.className = 'v0-minimap-tick';
    tick.style.width = `${w}%`;
    tick.style.backgroundColor = c;
    ticksEl.appendChild(tick);
  }

  if (markersEl) {
    markersEl.innerHTML = '';
    parsedLines.forEach((line, i) => {
      const colors = getLineCoverageColors(line);
      if (!colors.length) return;
      const m = document.createElement('div');
      m.className = 'v0-minimap-marker';
      m.style.backgroundColor = colors[0];
      m.style.top = `${16 + i * 6}px`;
      markersEl.appendChild(m);
    });
  }
  updateMinimapViewport();
}

function updateMinimapViewport() {
  const body = document.getElementById('workspace-body');
  const vp = document.getElementById('minimap-viewport');
  const ticks = document.getElementById('minimap-ticks');
  if (!body || !vp || !ticks) return;
  const ratio = body.clientHeight / Math.max(body.scrollHeight, 1);
  const h = Math.max(12, ticks.offsetHeight * ratio);
  vp.style.height = `${h}px`;
  vp.style.top = `${(body.scrollTop / Math.max(body.scrollHeight, 1)) * ticks.offsetHeight + 8}px`;
}

function computeWorkspacePaths() {
  const svg = document.getElementById('workspace-svg');
  const body = document.getElementById('workspace-body');
  if (!svg || !body) return;

  const base = body.getBoundingClientRect();
  const ox = -base.left + body.scrollLeft;
  const oy = -base.top + body.scrollTop;

  const rectOf = id => {
    const el = body.querySelector(`[data-anchor="${id}"]`);
    return el ? el.getBoundingClientRect() : null;
  };

  const spine = document.getElementById('sync-lane');
  const spineX = spine ? spine.getBoundingClientRect().left + ox + 60 : 60;

  const paths = [];
  const hi = getHighlightedLineSet();
  const showIdx = idx => activeLineIndex < 0 || idx === activeLineIndex || hi.has(idx);

  parsedLines.forEach((line, idx) => {
    if (!showIdx(idx)) return;
    const links = getLineLinks(line).filter(l => l.link_type === 'clip');
    if (!links.length) return;
    const target = rectOf(`take-line-${idx}`) || rectOf(`line-${idx}`);
    const node = body.querySelector(`.sync-node-v0[data-line-index="${idx}"]`);
    if (!target || !node) return;
    const nr = node.getBoundingClientRect();
    const sx = nr.right + ox;
    const sy = nr.top + oy + nr.height / 2;
    const ex = target.left + ox;
    const ey = target.top + oy + target.height / 2;
    const clip = timelineClips.find(c => linkMatchesClip(links[0], c));
    const stroke = clip ? cameraColorForClip(clip) : '#5b6472';
    const c1x = sx + (ex - sx) * 0.5;
    const c2x = ex - (ex - sx) * 0.5;
    if (Math.abs(sy - ey) < 8) {
      paths.push({ d: `M ${sx} ${sy} L ${ex} ${ey}`, stroke });
    } else {
      paths.push({ d: `M ${sx} ${sy} C ${c1x} ${sy}, ${c2x} ${ey}, ${ex} ${ey}`, stroke });
    }
  });

  const w = body.scrollWidth;
  const h = body.scrollHeight;
  svg.setAttribute('width', String(w));
  svg.setAttribute('height', String(h));
  svg.innerHTML = paths.map(p =>
    `<path d="${p.d}" fill="none" stroke="${p.stroke}" stroke-width="2" stroke-linecap="round" opacity="0.85"/>`
  ).join('');
}
